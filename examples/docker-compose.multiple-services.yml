# Example: Multiple Services from NAS

version: '3.8'

services:
  # Tunnel for web application
  porthole-web:
    build: ..
    image: porthole:latest
    container_name: porthole-web
    restart: unless-stopped
    environment:
      SSH_REMOTE_HOST: vps.example.com
      SSH_REMOTE_PORT: 22
      SSH_REMOTE_USER: myuser
      SSH_TUNNEL_TYPE: remote
      SSH_TUNNEL_LOCAL_PORT: 80
      SSH_TUNNEL_REMOTE_PORT: 8080
      SSH_STRICT_HOST_KEY_CHECKING: no
    volumes:
      - ../ssh-keys:/ssh-key:ro
    network_mode: host

  # Tunnel for Plex or media server
  porthole-plex:
    build: ..
    image: porthole:latest
    container_name: porthole-plex
    restart: unless-stopped
    environment:
      SSH_REMOTE_HOST: vps.example.com
      SSH_REMOTE_PORT: 22
      SSH_REMOTE_USER: myuser
      SSH_TUNNEL_TYPE: remote
      SSH_TUNNEL_LOCAL_PORT: 32400
      SSH_TUNNEL_REMOTE_PORT: 32400
      SSH_STRICT_HOST_KEY_CHECKING: no
    volumes:
      - ../ssh-keys:/ssh-key:ro
    network_mode: host

  # Tunnel for SSH access to NAS
  porthole-ssh:
    build: ..
    image: porthole:latest
    container_name: porthole-ssh
    restart: unless-stopped
    environment:
      SSH_REMOTE_HOST: vps.example.com
      SSH_REMOTE_PORT: 22
      SSH_REMOTE_USER: myuser
      SSH_TUNNEL_TYPE: remote
      SSH_TUNNEL_LOCAL_PORT: 22
      SSH_TUNNEL_REMOTE_PORT: 2222
      SSH_STRICT_HOST_KEY_CHECKING: no
    volumes:
      - ../ssh-keys:/ssh-key:ro
    network_mode: host
