name: Docker Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Validate configuration files
      run: |
        chmod +x validate.sh
        ./validate.sh
    
    - name: Validate shell scripts
      run: |
        shellcheck entrypoint.sh test.sh validate.sh || true

  build:
    runs-on: ubuntu-latest
    needs: validate
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        load: true
        tags: porthole:test
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Integration Test with Real SSH Server
      run: |
        # --- PRE-CLEANUP ---
        # Kill and remove any leftovers from previous failed runs
        # '|| true' prevents failure if they don't exist
        docker rm -f mock-server porthole-test || true
        docker network rm test-net || true

        # 1. Create a private network for the test if not exists
        docker network create test-net || true

        # 2. Generate a temporary SSH keypair (no passphrase)
        ssh-keygen -t ed25519 -f ./test_key -N ""
        chmod 600 ./test_key

        # 3. Start a dummy SSH Server
        # We use a lightweight image that accepts a public key via ENV var
        docker run -d \
          --rm \
          --name mock-server \
          --network test-net \
          -e PUBLIC_KEY="$(cat ./test_key.pub)" \
          -e USER_NAME=testuser \
          lscr.io/linuxserver/openssh-server:latest

        # Wait a few seconds for the server to boot up
        sleep 5

        # 4. Run YOUR image (The Client)
        # We mount the private key and point it to 'mock-server'
        # We run in detached mode (-d) because autossh runs forever
        CONTAINER_ID=$(docker run -d \
          --rm \
          --name porthole-test \
          --network test-net \
          -e SSH_PRIVATE_KEY="$(cat ./test_key)" \
          -e SSH_REMOTE_HOST=mock-server \
          -e SSH_REMOTE_USER=testuser \
          -e SSH_TUNNELS=R:8000:localhost:8000 \
          porthole:test)

        # 5. Verification Phase
        echo "Container started as ID: $CONTAINER_ID"
        sleep 5

        # Check if the container is still running (it should be!)
        if [ "$(docker inspect -f '{{.State.Running}}' $CONTAINER_ID)" = "true" ]; then
            echo "✅ Success: Container is running and maintaining connection."
        else
            echo "❌ Failure: Container crashed."
            docker logs $CONTAINER_ID
            exit 1
        fi

        # Optional: Grep logs to confirm connection established
        if docker logs $CONTAINER_ID 2>&1 | grep -q "Entering interactive session"; then
             echo "✅ Logs confirm SSH session established."
        else
             echo "⚠️  Warning: Could not find success message in logs, but container is running."
             # Uncomment below to see logs if this happens
             # docker logs $CONTAINER_ID
        fi

    - name: Cleanup
      if: always() # This runs even if the previous step failed!
      run: |
        docker rm -f mock-server porthole-test || true
        docker network rm test-net || true

  docker-hub:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      if: github.event_name != 'pull_request'
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          delivator/porthole
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha
          type=raw,value=latest,enable={{is_default_branch}}
    
    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64,linux/arm/v7
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
